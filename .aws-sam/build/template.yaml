AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Serverless Orders Workflow - on INSERT to DynamoDB trigger Lambda, which\
  \ sends an SNS notification or starts Step\_Functions.\n"
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        SNS_TOPIC_ARN:
          Ref: OrderTopic
Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Orders
      AttributeDefinitions:
      - AttributeName: OrderId
        AttributeType: S
      KeySchema:
      - AttributeName: OrderId
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_IMAGE
  OrderTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: OrderTopic
  OrderTopicEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: OrderTopic
      Protocol: email
      Endpoint: emmy06.nar@gmail.com
  ProcessOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ProcessOrderFunction
      CodeUri: ProcessOrderFunction
      Handler: app.lambda_handler
      Policies:
      - AWSLambdaBasicExecutionRole
      - SNSPublishMessagePolicy:
          TopicName:
            Fn::GetAtt:
            - OrderTopic
            - TopicName
      Events:
        OrderStream:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
              - OrdersTable
              - StreamArn
            StartingPosition: LATEST
    Metadata:
      SamResourceId: ProcessOrderFunction
Outputs:
  OrdersTableName:
    Description: DynamoDB Table Name
    Value:
      Ref: OrdersTable
  ProcessOrderFunctionArn:
    Description: Lambda ARN
    Value:
      Fn::GetAtt:
      - ProcessOrderFunction
      - Arn
  OrderTopicArn:
    Description: SNS Topic ARN
    Value:
      Ref: OrderTopic
